<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiểm tra thiết bị</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<div class="container">

  <h2>TẠO YÊU CẦU KIỂM TRA</h2>

  <label>Nội dung yêu cầu</label>
  <textarea
    id="requestContent"
    placeholder="Nhập nội dung cần kiểm tra..."
  ></textarea>

  <label>Tìm thiết bị</label>

  <input
    type="text"
    id="searchInput"
    placeholder="Nhập Code, ví dụ PZL1..."
  >

  <div id="status"></div>

  <div id="results"></div>

  <div class="selected-box">
    Đã chọn:
    <strong id="selectedCount">0</strong>
    thiết bị
  </div>

  <div id="selectedList"></div>

  <button id="createJobBtn">
    TẠO CÔNG VIỆC
  </button>

</div>

<script src="app.js"></script>

</body>
</html>
