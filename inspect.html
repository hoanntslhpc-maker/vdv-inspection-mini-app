<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Kiểm tra thiết bị</title>

  <link
    rel="stylesheet"
    href="./inspect.css"
  >

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    /* =====================================================
       BASE
    ===================================================== */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f4f7fb;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      color: #172033;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    .hidden {
      display: none !important;
    }


    /* =====================================================
       MAIN CONTAINER
    ===================================================== */

    .app-container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding:
        18px
        14px
        40px;
    }


    /* =====================================================
       TITLE
    ===================================================== */

    .page-title {
      margin-bottom: 18px;
      text-align: center;
    }

    .page-title h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.3;
      font-weight: 800;
      color: #123d70;
      letter-spacing: 0.3px;
    }


    /* =====================================================
       LOADING
    ===================================================== */

    .loading-card {
      background: #ffffff;
      border: 1px solid #dce4ee;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      color: #526176;
      margin-bottom: 16px;
    }


    /* =====================================================
       JOB INFORMATION
    ===================================================== */

    .job-info-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }


    .info-card {
      background: #ffffff;
      border: 1px solid #dce4ee;
      border-radius: 16px;
      padding: 15px 16px;
      min-width: 0;

      box-shadow:
        0 4px 14px
        rgba(15, 23, 42, 0.045);
    }


    .info-card.full-width {
      grid-column: 1 / -1;
    }


    .info-label {
      margin-bottom: 6px;
      font-size: 13px;
      line-height: 1.3;
      color: #718096;
      font-weight: 600;
    }


    .info-value {
      font-size: 16px;
      line-height: 1.45;
      color: #182235;
      font-weight: 700;
      word-break: break-word;
    }


    .info-value-number {
      font-size: 22px;
      color: #123d70;
    }


    .info-value-status {
      font-size: 17px;
      color: #167647;
    }


    /* =====================================================
       SECTION
    ===================================================== */

    .section {
      margin-top: 24px;
    }


    .section h2 {
      margin:
        0
        0
        12px;

      font-size: 18px;
      line-height: 1.4;
      color: #172033;
      font-weight: 800;
    }


    /* =====================================================
       DEVICE TYPE
    ===================================================== */

    .device-type-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 10px;
    }


    .device-type-button {
      width: 100%;
      min-height: 72px;
      padding: 13px 14px;

      border:
        1px solid
        #d9e2ec;

      border-radius: 15px;

      background: #ffffff;

      color: #172033;

      text-align: left;

      cursor: pointer;

      box-shadow:
        0 3px 10px
        rgba(15, 23, 42, 0.04);
    }


    .device-type-button.active {
      border:
        2px solid
        #2878c7;

      background: #edf6ff;
    }


    .device-type-name {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.35;
    }


    .device-type-count {
      margin-top: 5px;
      font-size: 13px;
      color: #66768b;
      line-height: 1.35;
    }


    /* =====================================================
       DEVICE LIST
    ===================================================== */

    .device-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }


    .device-button {
      width: 100%;
      padding: 14px 15px;

      border:
        1px solid
        #d9e2ec;

      border-radius: 15px;

      background: #ffffff;

      text-align: left;

      cursor: pointer;

      box-shadow:
        0 3px 10px
        rgba(15, 23, 42, 0.04);
    }


    .device-button.active {
      border:
        2px solid
        #2878c7;

      background: #edf6ff;
    }


    .device-code {
      font-size: 16px;
      font-weight: 800;
      color: #172033;
    }


    .device-meta {
      margin-top: 5px;
      font-size: 13px;
      line-height: 1.45;
      color: #6c7b90;
    }


    /* =====================================================
       SELECTED DEVICE
    ===================================================== */

    .selected-device-section {
      margin-top: 24px;
      margin-bottom: 18px;
    }


    .selected-device-card {
      background: #edf6ff;

      border:
        1px solid
        #b9d7f4;

      border-radius: 16px;

      padding: 15px 17px;
    }


    .selected-device-label {
      font-size: 13px;
      font-weight: 600;
      color: #5d7087;
      margin-bottom: 5px;
    }


    .selected-device-code {
      font-size: 20px;
      font-weight: 800;
      color: #145a9c;
      word-break: break-word;
    }


    /* =====================================================
       PROCEDURE
    ===================================================== */

    .procedure-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }


    .procedure-step {
      overflow: hidden;

      background: #ffffff;

      border:
        1px solid
        #dce4ee;

      border-radius: 17px;

      box-shadow:
        0 4px 14px
        rgba(15, 23, 42, 0.045);
    }


    .step-header {
      display: flex;
      align-items: center;
      gap: 10px;

      padding:
        13px
        15px;

      background: #f5f9fd;

      border-bottom:
        1px solid
        #e2e8f0;
    }


    .step-number {
      width: 30px;
      height: 30px;

      flex:
        0 0
        30px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #226eb5;
      color: #ffffff;

      font-size: 14px;
      font-weight: 800;
    }


    .step-title {
      font-size: 15px;
      line-height: 1.4;
      font-weight: 800;
      color: #172033;
    }


    .step-body {
      padding: 15px;
    }


    .step-info {
      margin-bottom: 13px;
    }


    .step-info-title {
      margin-bottom: 4px;
      font-size: 13px;
      font-weight: 700;
      color: #607086;
    }


    .step-info-content {
      font-size: 14px;
      line-height: 1.5;
      color: #263449;
    }


    /* =====================================================
       FORM
    ===================================================== */

    .form-group {
      margin-top: 14px;
    }


    .form-label {
      display: block;
      margin-bottom: 6px;

      font-size: 14px;
      font-weight: 700;
      color: #34445a;
    }


    input[type="text"],
    input[type="number"],
    select,
    textarea {

      width: 100%;

      border:
        1px solid
        #cfd9e5;

      border-radius: 12px;

      background: #ffffff;

      padding:
        11px
        12px;

      font-size: 16px;

      color: #172033;

      outline: none;
    }


    textarea {
      min-height: 82px;
      resize: vertical;
    }


    input:focus,
    select:focus,
    textarea:focus {

      border-color: #2878c7;

      box-shadow:
        0 0 0 3px
        rgba(40, 120, 199, 0.10);
    }


    .number-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }


    .number-row input {
      flex: 1;
      min-width: 0;
    }


    .unit-box {
      display: flex;
      align-items: center;
      justify-content: center;

      min-width: 65px;

      padding:
        0
        10px;

      border:
        1px solid
        #cfd9e5;

      border-radius: 12px;

      background: #f4f7fa;

      font-size: 14px;
      font-weight: 700;
      color: #53647a;
    }


    /* =====================================================
       PHOTO
    ===================================================== */

    .photo-box {
      margin-top: 15px;

      padding: 13px;

      background: #f8fafc;

      border:
        1px dashed
        #b9c7d6;

      border-radius: 13px;
    }


    .photo-title {
      font-size: 14px;
      font-weight: 800;
      color: #34445a;
    }


    .photo-required {
      margin:
        4px
        0
        10px;

      font-size: 12px;
      color: #d05656;
    }


    .photo-preview {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 7px;

      margin-top: 10px;
    }


    .photo-preview img {
      width: 100%;
      aspect-ratio: 1 / 1;

      object-fit: cover;

      border-radius: 9px;

      border:
        1px solid
        #dce4ee;
    }


    /* =====================================================
       BUTTONS
    ===================================================== */

    .btn {
      width: 100%;

      border: 0;

      border-radius: 14px;

      padding:
        13px
        16px;

      font-size: 15px;
      font-weight: 800;

      cursor: pointer;
    }


    .btn-primary {
      background: #1769aa;
      color: #ffffff;
    }


    .btn-secondary {
      background: #e9eef4;
      color: #34445a;
    }


    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }


    /* =====================================================
       SAVE
    ===================================================== */

    .save-section {
      margin-top: 20px;
    }


    .btn-save {
      min-height: 52px;

      font-size: 16px;

      box-shadow:
        0 6px 16px
        rgba(23, 105, 170, 0.18);
    }


    /* =====================================================
       BOTTOM
    ===================================================== */

    .bottom-actions {
      margin-top: 14px;
      padding-bottom: env(safe-area-inset-bottom);
    }


    /* =====================================================
       ERROR
    ===================================================== */

    .error-box {
      padding: 14px;

      background: #fff1f1;

      border:
        1px solid
        #f0c6c6;

      border-radius: 12px;

      color: #a13232;

      line-height: 1.5;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      .app-container {
        padding:
          16px
          12px
          34px;
      }


      .page-title h1 {
        font-size: 22px;
      }


      /*
        Trên điện thoại vẫn giữ:
        Mã công việc + Người yêu cầu: 2 ô
        Tổng thiết bị + Trạng thái: 2 ô
      */

      .job-info-grid {
        gap: 9px;
      }


      .info-card {
        padding: 13px 12px;
        border-radius: 14px;
      }


      .info-label {
        font-size: 12px;
      }


      .info-value {
        font-size: 14px;
      }


      .info-value-number {
        font-size: 20px;
      }


      .info-value-status {
        font-size: 14px;
      }


      .device-type-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>

  <main class="app-container">


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <section class="page-title">

      <h1>
        KIỂM TRA THIẾT BỊ
      </h1>

    </section>



    <!-- =====================================================
         LOADING
    ====================================================== -->

    <section
      id="loading"
      class="loading-card"
    >

      Đang tải dữ liệu...

    </section>



    <!-- =====================================================
         JOB INFORMATION
    ====================================================== -->

    <section
      id="jobInfo"
      class="job-info-grid hidden"
    >


      <!-- MÃ CÔNG VIỆC -->

      <div class="info-card">

        <div class="info-label">
          Mã công việc
        </div>

        <div
          id="jobId"
          class="info-value"
        >
          -
        </div>

      </div>



      <!-- NGƯỜI YÊU CẦU -->

      <div class="info-card">

        <div class="info-label">
          Người yêu cầu
        </div>

        <div
          id="jobRequester"
          class="info-value"
        >
          -
        </div>

      </div>



      <!-- NỘI DUNG CÔNG VIỆC -->

      <div class="info-card full-width">

        <div class="info-label">
          Nội dung công việc
        </div>

        <div
          id="jobRequest"
          class="info-value"
        >
          -
        </div>

      </div>



      <!-- TỔNG THIẾT BỊ -->

      <div class="info-card">

        <div class="info-label">
          Tổng thiết bị
        </div>

        <div
          id="deviceCount"
          class="info-value info-value-number"
        >
          0
        </div>

      </div>



      <!-- TRẠNG THÁI -->

      <div class="info-card">

        <div class="info-label">
          Trạng thái
        </div>

        <div
          id="jobStatus"
          class="info-value info-value-status"
        >
          -
        </div>

      </div>


    </section>



    <!-- =====================================================
         1. CHỌN LOẠI THIẾT BỊ
    ====================================================== -->

    <section
      id="deviceTypeSection"
      class="section hidden"
    >

      <h2>
        1. Chọn loại thiết bị
      </h2>

      <div
        id="deviceTypes"
        class="device-type-grid"
      ></div>

    </section>



    <!-- =====================================================
         2. CHỌN THIẾT BỊ
    ====================================================== -->

    <section
      id="deviceSection"
      class="section hidden"
    >

      <h2>
        2. Chọn thiết bị kiểm tra
      </h2>

      <div
        id="deviceList"
        class="device-list"
      ></div>

    </section>



    <!-- =====================================================
         THIẾT BỊ ĐANG KIỂM TRA
         NẰM TRƯỚC MỤC 3
    ====================================================== -->

    <section
      id="selectedDeviceSection"
      class="selected-device-section hidden"
    >

      <div class="selected-device-card">

        <div class="selected-device-label">
          Thiết bị đang kiểm tra
        </div>

        <div
          id="selectedDeviceCode"
          class="selected-device-code"
        >
        </div>

      </div>

    </section>



    <!-- =====================================================
         3. QUY TRÌNH
    ====================================================== -->

    <section
      id="procedureSection"
      class="section hidden"
    >

      <h2>
        3. Thực hiện quy trình kiểm tra
      </h2>

      <div
        id="procedureList"
        class="procedure-list"
      ></div>

    </section>



    <!-- =====================================================
         SAVE
    ====================================================== -->

    <section
      id="saveSection"
      class="save-section hidden"
    >

      <button
        id="saveInspectionButton"
        type="button"
        class="btn btn-primary btn-save"
        onclick="saveInspection(event)"
      >
        💾 LƯU KẾT QUẢ KIỂM TRA
      </button>

    </section>



    <!-- =====================================================
         BACK
    ====================================================== -->

    <section class="bottom-actions">

      <button
        type="button"
        class="btn btn-secondary"
        onclick="goBackToTelegram()"
      >
        ← Quay lại
      </button>

    </section>


  </main>



  <!-- =====================================================
       INSPECT JS
  ====================================================== -->

  <script src="./inspect.js"></script>


  <script>

    /* Telegram Mini App */

    try {

      if (
        window.Telegram &&
        window.Telegram.WebApp
      ) {

        window.Telegram.WebApp.ready();

        window.Telegram.WebApp.expand();

      }

    }

    catch (error) {

      console.log(
        "Telegram init error:",
        error
      );

    }



    /* Quay lại */

    function goBackToTelegram() {

      try {

        if (
          window.Telegram &&
          window.Telegram.WebApp &&
          typeof window.Telegram.WebApp.close === "function"
        ) {

          window.Telegram.WebApp.close();

          return;

        }

      }

      catch (error) {

        console.log(
          "Telegram close error:",
          error
        );

      }


      if (
        window.history.length > 1
      ) {

        window.history.back();

      }

    }



    /* Không cho HTML tự submit */

    document.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();

        return false;

      }
    );

  </script>


</body>

</html>
