<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kiểm tra thiết bị</title>

  <link
    rel="stylesheet"
    href="/inspect.css"
  >

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <header class="app-header">
    <h1>🔍 KIỂM TRA THIẾT BỊ</h1>
    <p id="jobId">Đang tải mã công việc...</p>
  </header>


  <!-- LOADING / ERROR -->
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div>
      Đang tải thông tin công việc...
    </div>
  </div>


  <!-- JOB INFORMATION -->
  <section
    id="jobInfo"
    class="card hidden"
  >

    <div class="card-title">
      Thông tin công việc
    </div>

    <div class="job-grid">

      <div class="info-item">
        <div class="info-label">
          Nội dung yêu cầu
        </div>

        <div
          id="jobRequest"
          class="info-value"
        >
          -
        </div>
      </div>


      <div class="info-item">
        <div class="info-label">
          Người yêu cầu
        </div>

        <div
          id="jobRequester"
          class="info-value"
        >
          -
        </div>
      </div>


      <div class="info-item">
        <div class="info-label">
          Tổng thiết bị
        </div>

        <div
          id="deviceCount"
          class="info-value"
        >
          0
        </div>
      </div>


      <div class="info-item">
        <div class="info-label">
          Trạng thái
        </div>

        <div
          id="jobStatus"
          class="info-value"
        >
          -
        </div>
      </div>

    </div>

  </section>


  <!-- DEVICE TYPE -->
  <section
    id="deviceTypeSection"
    class="hidden"
  >

    <div class="section-title">
      1. Chọn loại thiết bị
    </div>

    <div
      id="deviceTypes"
      class="device-type-list"
    ></div>

  </section>


  <!-- DEVICE LIST -->
  <section
    id="deviceSection"
    class="hidden"
  >

    <div class="section-title">
      2. Chọn thiết bị kiểm tra
    </div>

    <div
      id="deviceList"
      class="device-list"
    ></div>

  </section>


  <!-- PROCEDURE -->
  <section
    id="procedureSection"
    class="hidden"
  >

    <div class="card">

      <div class="info-label">
        Thiết bị đang kiểm tra
      </div>

      <div
        id="selectedDeviceCode"
        class="device-code"
      ></div>

    </div>


    <div class="section-title">
      3. Thực hiện quy trình kiểm tra
    </div>


    <div
      id="procedureList"
    ></div>

  </section>


  <!-- SAVE -->
  <section
    id="saveSection"
    class="hidden"
  >

    <div class="action-bar">

      <button
        type="button"
        class="btn btn-success"
        onclick="saveInspection()"
      >
        💾 LƯU KẾT QUẢ KIỂM TRA
      </button>

    </div>

  </section>

</div>


<script src="/inspect.js"></script>

</body>
</html>
